specVersion: "4.0"
metadata:
  name: com.gsp.sap.procurement.ui.poautomationui
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        bsp: "Fiori:"
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: dist
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-servestatic
      beforeMiddleware: fiori-tools-proxy
      configuration:
        paths:
          - path: "/**/Fiori:"
            src: dist
          - path: /**/com/gsp/sap/procurement/ui/poautomationui
            src: dist
resources:
  configuration:
    paths:
      webapp: dist
