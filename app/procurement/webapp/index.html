<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>BTP Procurement Automation</title>
    <link rel="icon" type="image/png" href="faviconn.jpg" />
    <style>
      html,
      body,
      body > div,
      #container,
      #container-uiarea {
        height: 100%;
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{
            "com.gsp.sap.procurement.ui.poautomationui": "./"
        }'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
      data-sap-ui-frame-options="trusted"
    ></script>
  </head>
  <body class="sapUiBody sapUiSizeCompact" id="content">
    <div
      data-sap-ui-component
      data-name="com.gsp.sap.procurement.ui.poautomationui"
      data-id="container"
      data-settings='{"id" : "com.gsp.sap.procurement.ui.poautomationui"}'
      data-handle-validation="true"
    ></div>
  </body>
</html>
